<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pic1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  figure { width: 100%; font-family: system-ui, sans-serif; }
  .img-border {
    height: 4px;
    background: linear-gradient(90deg, #24324A, #B6842D);
  }
  figure img {
    width: 100%;
    height: 360px;
    object-fit: cover;
    display: block;
  }
  figcaption {
    background: #24324A;
    color: #b0bec5;
    font-size: 12px;
    padding: 10px 16px;
    line-height: 1.5;
  }
  figcaption strong {
    color: #B6842D;
  }
</style>
</head>
<body>
<figure>
  <div class="img-border"></div>
  <img
    src="https://images.unsplash.com/photo-1517927033932-b3d18e61fb3a?w=1200&auto=format&fit=crop&q=80"
    alt="Rainbow Pride flags displayed at a major league baseball stadium during Pride Night"
  >
  <figcaption>
    <strong>Pride Night at the ballpark.</strong> MLB held Pride Night events across 28 tracked team markets — more than any other league in the study. Photo: Unsplash
  </figcaption>
</figure>
</body>
</html>
