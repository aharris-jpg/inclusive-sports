<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pic1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  figure { width: 100%; font-family: system-ui, sans-serif; }
  .img-border { height: 4px; background: linear-gradient(90deg, #24324A, #B6842D); }
  figure img { width: 100%; height: 360px; object-fit: cover; object-position: center top; display: block; }
  figcaption { background: #24324A; color: #b0bec5; font-size: 12px; padding: 10px 16px; line-height: 1.5; }
  figcaption strong { color: #B6842D; }
</style>
</head>
<body>
<figure>
  <div class="img-border"></div>
  <img
    src="https://bostonglobe-prod.cdn.arcpublishing.com/resizer/v2/2GOA2YOQC663H57A523PPAMK3Q.jpg?auth=17fea8d60d387a3d4ffceea40bb9a9ff2902ac0ca2015d624ba62d861b92cd1c&width=1440"
    alt="LGBTQ+ Pride Night event at a major American sports venue"
  >
  <figcaption>
    <strong>Pride in the stands.</strong> Across the cities in this study, Pride Night events have become one of the most visible signals of a franchise's commitment to LGBTQ+ fans. Photo: Boston Globe
  </figcaption>
</figure>
</body>
</html>
