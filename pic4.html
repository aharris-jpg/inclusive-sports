<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pic4</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  figure { width: 100%; font-family: system-ui, sans-serif; }
  .img-border { height: 4px; background: linear-gradient(90deg, #24324A, #B6842D); }
  figure img { width: 100%; height: 360px; object-fit: cover; object-position: center top; display: block; }
  figcaption { background: #24324A; color: #b0bec5; font-size: 12px; padding: 10px 16px; line-height: 1.5; }
  figcaption strong { color: #B6842D; }
</style>
</head>
<body>
<figure>
  <div class="img-border"></div>
  <img
    src="https://www.sportsnet.ca/wp-content/uploads/2024/06/Blue-Jays-Pride-Night-at-Rogers-Centre-768x432.jpg"
    alt="Toronto Blue Jays Pride Night at Rogers Centre with rainbow flags and fans"
  >
  <figcaption>
    <strong>Pride Weekend at Rogers Centre.</strong> The Toronto Blue Jays hosted a multi-day Pride Weekend — one of the more expansive Pride commitments in the MLB dataset. Photo: Sportsnet
  </figcaption>
</figure>
</body>
</html>
