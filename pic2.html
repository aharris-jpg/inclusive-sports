<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pic2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }
  figure { width: 100%; font-family: system-ui, sans-serif; }
  .img-border { height: 4px; background: linear-gradient(90deg, #24324A, #B6842D); }
  figure img { width: 100%; height: 360px; object-fit: cover; object-position: center; display: block; }
  figcaption { background: #24324A; color: #b0bec5; font-size: 12px; padding: 10px 16px; line-height: 1.5; }
  figcaption strong { color: #B6842D; }
</style>
</head>
<body>
<figure>
  <div class="img-border"></div>
  <img
    src="https://images.mlssoccer.com/image/private/t_editorial_landscape_8_desktop_mobile/mls-col-prd/hrxb4kdverbw5xopf0ic.jpg"
    alt="MLS Pride Night celebration with fans and players on the pitch"
  >
  <figcaption>
    <strong>MLS leads on fan perception.</strong> 56% of fans surveyed rate MLS as "very supportive" of LGBTQ+ inclusion — the highest figure of any league in the study. Photo: MLS
  </figcaption>
</figure>
</body>
</html>
